<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
<rect width="100%" height="100%" fill="#ffffff"/>
<title>How EchoFox settings work</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1a1a1a">
<rect x="16" y="40" width="300" height="64" rx="6" fill="#fff4e5" stroke="#c77700" stroke-width="1.5"/>
<text x="30" y="66" font-size="14" font-weight="600">Server: its settings described</text>
<text x="30" y="88">tuning.KNOBS, settings.SETTINGS → info</text>
<rect x="16" y="130" width="300" height="64" rx="6" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="30" y="156" font-size="14" font-weight="600">App: its settings described</text>
<text x="30" y="178">keys, microphone, labeling</text>
<rect x="16" y="220" width="300" height="64" rx="6" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="30" y="246" font-size="14" font-weight="600">Layout (in the app only)</text>
<text x="30" y="268">setting → menu or window page</text>
<rect x="370" y="130" width="200" height="64" rx="6" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="384" y="156" font-size="14" font-weight="600">Builder</text>
<text x="384" y="178">one for menu and window</text>
<rect x="634" y="60" width="230" height="56" rx="6" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="648" y="93" font-size="14" font-weight="600">Menu bar</text>
<rect x="634" y="170" width="230" height="56" rx="6" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="648" y="203" font-size="14" font-weight="600">Settings window with pages</text>
<rect x="370" y="300" width="280" height="64" rx="6" fill="#f2f2f2" stroke="#777777" stroke-width="1.5"/>
<text x="384" y="326" font-size="14" font-weight="600">~/.echofox/config.json</text>
<text x="384" y="348">the server picks up changes itself</text>
<path d="M316 72 L344 72 L344 150 L368 150" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="316" y1="162" x2="368" y2="162" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M316 252 L344 252 L344 176 L368 176" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M570 150 L602 150 L602 88 L632 88" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M570 176 L602 176 L602 198 L632 198" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="470" y1="194" x2="470" y2="298" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="250">values written</text>
</g>
</svg>
