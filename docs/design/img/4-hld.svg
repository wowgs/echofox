<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564">
<rect width="100%" height="100%" fill="#ffffff"/>
<title>Local Voice: приложение, сервер диктовки и модель</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1a1a1a">
<rect x="16" y="16" width="868" height="56" rx="6" fill="#f2f2f2" stroke="#777777" stroke-width="1.5"/>
<text x="28" y="38" font-size="14" font-weight="600">Целевое приложение</text>
<text x="28" y="58">Claude Desktop, Codex, Telegram, терминал: поле ввода с курсором</text>
<rect x="16" y="100" width="868" height="150" rx="6" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="28" y="122" font-size="14" font-weight="600">Приложение Local Voice (macOS)</text>
<rect x="30" y="134" width="198" height="100" rx="6" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="42" y="156" font-size="14" font-weight="600">Клавиши и снимок</text>
<text x="42" y="176">диктовка, приватная</text>
<text x="42" y="193">снимок фокуса</text>
<rect x="244" y="134" width="198" height="100" rx="6" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="256" y="156" font-size="14" font-weight="600">Захват звука</text>
<text x="256" y="176">AUHAL, выбранный</text>
<text x="256" y="193">микрофон, 16 кГц</text>
<rect x="458" y="134" width="198" height="100" rx="6" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="470" y="156" font-size="14" font-weight="600">Вставка</text>
<text x="470" y="176">в поле при старте,</text>
<text x="470" y="193">Cmd+V, буфер</text>
<rect x="672" y="134" width="198" height="100" rx="6" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="684" y="156" font-size="14" font-weight="600">UI</text>
<text x="684" y="176">меню, окно настроек,</text>
<text x="684" y="193">окно разметки</text>
<rect x="16" y="290" width="868" height="150" rx="6" fill="#fff4e5" stroke="#c77700" stroke-width="1.5"/>
<text x="28" y="312" font-size="14" font-weight="600">Сервер диктовки (launchd)</text>
<rect x="30" y="324" width="198" height="100" rx="6" fill="#ffffff" stroke="#c77700" stroke-width="1.5"/>
<text x="42" y="346" font-size="14" font-weight="600">Протокол и резка</text>
<text x="42" y="366">WebSocket; куски</text>
<text x="42" y="383">по ходу речи</text>
<rect x="244" y="324" width="198" height="100" rx="6" fill="#ffffff" stroke="#c77700" stroke-width="1.5"/>
<text x="256" y="346" font-size="14" font-weight="600">Проверка речи</text>
<text x="256" y="366">Silero VAD: речи</text>
<text x="256" y="383">не меньше 0,3 с</text>
<rect x="458" y="324" width="198" height="100" rx="6" fill="#ffffff" stroke="#c77700" stroke-width="1.5"/>
<text x="470" y="346" font-size="14" font-weight="600">Контекст</text>
<text x="470" y="366">адаптеры claude,</text>
<text x="470" y="383">telegram; термины</text>
<rect x="672" y="324" width="198" height="100" rx="6" fill="#ffffff" stroke="#c77700" stroke-width="1.5"/>
<text x="684" y="346" font-size="14" font-weight="600">Настройки, модели</text>
<text x="684" y="366">config.json, launchd,</text>
<text x="684" y="383">описание настроек</text>
<rect x="16" y="480" width="420" height="68" rx="6" fill="#eaf7ee" stroke="#2e8b57" stroke-width="1.5"/>
<text x="28" y="502" font-size="14" font-weight="600">llama-server: Gemma 4 E4B Q8_0</text>
<text x="28" y="522">два слота, без кэша промптов в RAM</text>
<rect x="464" y="480" width="420" height="68" rx="6" fill="#f2f2f2" stroke="#777777" stroke-width="1.5"/>
<text x="476" y="502" font-size="14" font-weight="600">Источники адаптеров</text>
<text x="476" y="522">сессии Claude Code, строки экрана Telegram</text>
<line x1="150" y1="74" x2="150" y2="98" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="160" y="91">нажатие, фокус</text>
<line x1="560" y1="98" x2="560" y2="74" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="570" y="91">текст</text>
<line x1="150" y1="252" x2="150" y2="288" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="160" y="275">звук, снимок фокуса</text>
<line x1="560" y1="288" x2="560" y2="252" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="570" y="275">тексты кусков</text>
<line x1="226" y1="442" x2="226" y2="478" stroke="#555555" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="236" y="465">запрос: кусок и текст перед ним; ответ: текст</text>
<line x1="674" y1="478" x2="674" y2="442" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="684" y="465">сессии, строки списков</text>
</g>
</svg>
