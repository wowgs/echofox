<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <title>How Local Voice works</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#111827">
    <!-- The key: a tap in any app starts and stops a dictation -->
    <rect x="314" y="16" width="80" height="52" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="318" y="20" width="72" height="44" rx="6" fill="#f3f4f6"/>
    <text x="354" y="46" font-size="20" text-anchor="middle">⌥</text>
    <text x="354" y="60" font-size="10" fill="#4b5563" text-anchor="middle">right Option</text>
    <text x="406" y="38" font-size="13">Tap the key in any app,</text>
    <text x="406" y="56" font-size="13">speak, and tap it again</text>
    <line x1="354" y1="68" x2="354" y2="122" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Any app: its conversation and the text box with the cursor -->
    <rect x="24" y="110" width="160" height="164" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="24" y="110" width="160" height="24" rx="8" fill="#f3f4f6"/>
    <circle cx="38" cy="122" r="4" fill="#f87171"/>
    <circle cx="50" cy="122" r="4" fill="#fbbf24"/>
    <circle cx="62" cy="122" r="4" fill="#34d399"/>
    <text x="74" y="126" font-size="11" fill="#4b5563">Claude, Telegram, Mail</text>
    <rect x="36" y="144" width="104" height="16" rx="8" fill="#e5e7eb"/>
    <rect x="72" y="166" width="100" height="16" rx="8" fill="#dbeafe"/>
    <rect x="36" y="188" width="92" height="16" rx="8" fill="#e5e7eb"/>
    <rect x="36" y="222" width="136" height="38" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="44" y="245" font-size="11" fill="#4b5563">your text here</text>
    <line x1="128" y1="230" x2="128" y2="252" stroke="#2563eb" stroke-width="2"/>

    <!-- The programs of Local Voice -->
    <rect x="274" y="124" width="160" height="96" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="354" y="164" font-size="15" font-weight="600" text-anchor="middle">Local Voice</text>
    <text x="354" y="186" font-size="12" fill="#4b5563" text-anchor="middle">in the menu bar</text>

    <rect x="524" y="124" width="160" height="96" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <text x="604" y="164" font-size="15" font-weight="600" text-anchor="middle">Dictation server</text>
    <text x="604" y="186" font-size="12" fill="#4b5563" text-anchor="middle">finds speech, cuts pieces</text>

    <rect x="774" y="124" width="160" height="96" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="854" y="164" font-size="15" font-weight="600" text-anchor="middle">Gemma 4</text>
    <text x="854" y="186" font-size="12" fill="#4b5563" text-anchor="middle">llama-server, on the GPU</text>

    <rect x="524" y="318" width="160" height="80" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="604" y="352" font-size="15" font-weight="600" text-anchor="middle">Adapter</text>
    <text x="604" y="374" font-size="12" fill="#4b5563" text-anchor="middle">a plugin for each app</text>

    <!-- Any app and Local Voice -->
    <line x1="184" y1="150" x2="272" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="229" y="130" font-size="12" text-anchor="middle">where the</text>
    <text x="229" y="144" font-size="12" text-anchor="middle">cursor is</text>
    <line x1="274" y1="241" x2="174" y2="241" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="229" y="234" font-size="12" text-anchor="middle">the text</text>

    <!-- Local Voice and the server -->
    <line x1="434" y1="150" x2="522" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="479" y="130" font-size="12" text-anchor="middle">your voice and</text>
    <text x="479" y="144" font-size="12" text-anchor="middle">the cursor place</text>
    <line x1="524" y1="198" x2="436" y2="198" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="479" y="214" font-size="12" text-anchor="middle">the text</text>

    <!-- The server and Gemma -->
    <line x1="684" y1="150" x2="772" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="729" y="116" font-size="12" text-anchor="middle">a piece of</text>
    <text x="729" y="130" font-size="12" text-anchor="middle">your voice, the</text>
    <text x="729" y="144" font-size="12" text-anchor="middle">conversation</text>
    <line x1="774" y1="198" x2="686" y2="198" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="729" y="214" font-size="12" text-anchor="middle">its text</text>

    <!-- The server and the adapter -->
    <line x1="584" y1="220" x2="584" y2="316" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="576" y="272" font-size="12" text-anchor="end">where the cursor is</text>
    <line x1="624" y1="318" x2="624" y2="222" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="632" y="266" font-size="12">latest messages,</text>
    <text x="632" y="280" font-size="12">names and terms</text>

    <!-- The adapter reads the conversation of that app -->
    <path d="M524,372 L104,372 L104,276" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <text x="314" y="392" font-size="12" fill="#047857" text-anchor="middle">reads the conversation of that app</text>
  </g>
</svg>
