<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <title>How Local Voice works</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#111827">
    <!-- The Mac -->
    <rect x="16" y="16" width="928" height="428" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="32" y="42" font-size="14" fill="#4b5563">Your Mac: the audio and the text stay on it</text>

    <!-- Row 1 -->
    <rect x="40" y="64" width="220" height="160" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="56" y="92" font-size="15" font-weight="600">Local Voice app</text>
    <text x="56" y="110" font-size="12" fill="#4b5563">in the menu bar</text>
    <text x="56" y="136" font-size="13">Starts and stops on a key tap</text>
    <text x="56" y="158" font-size="13">Records the microphone</text>
    <text x="56" y="180" font-size="13">Notes where the cursor is</text>
    <text x="56" y="202" font-size="13">Inserts the text there</text>

    <rect x="370" y="64" width="220" height="160" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <text x="386" y="92" font-size="15" font-weight="600">Dictation server</text>
    <text x="386" y="110" font-size="12" fill="#4b5563">Python</text>
    <text x="386" y="136" font-size="13">Cuts the audio into pieces</text>
    <text x="386" y="158" font-size="13">Skips pieces without speech</text>
    <text x="386" y="180" font-size="13">Adds the chat context</text>
    <text x="386" y="202" font-size="13">Saves the recordings</text>

    <rect x="700" y="64" width="220" height="160" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="716" y="92" font-size="15" font-weight="600">llama-server</text>
    <text x="716" y="110" font-size="12" fill="#4b5563">llama.cpp, on the GPU</text>
    <text x="716" y="136" font-size="13">Gemma 4 E4B model</text>
    <text x="716" y="158" font-size="13">Audio and text in,</text>
    <text x="716" y="180" font-size="13">text out</text>

    <!-- Row 2 -->
    <rect x="40" y="304" width="220" height="100" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="56" y="332" font-size="15" font-weight="600">The app you write in</text>
    <text x="56" y="356" font-size="13">Claude, Telegram, Mail,</text>
    <text x="56" y="376" font-size="13">any text box</text>

    <rect x="370" y="304" width="220" height="100" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="386" y="332" font-size="15" font-weight="600">Adapters</text>
    <text x="386" y="356" font-size="13">One plugin for each app:</text>
    <text x="386" y="376" font-size="13">Claude, Telegram</text>

    <rect x="700" y="304" width="220" height="100" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="716" y="332" font-size="15" font-weight="600">Config file</text>
    <text x="716" y="356" font-size="13">~/.local-voice/config.json</text>
    <text x="716" y="376" font-size="13">The app writes, the server reads</text>

    <!-- App and server -->
    <line x1="260" y1="124" x2="368" y2="124" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="315" y="102" font-size="12" text-anchor="middle">audio and</text>
    <text x="315" y="116" font-size="12" text-anchor="middle">cursor place</text>
    <line x1="370" y1="172" x2="262" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="315" y="190" font-size="12" text-anchor="middle">text</text>

    <!-- Server and model -->
    <line x1="590" y1="124" x2="698" y2="124" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="645" y="102" font-size="12" text-anchor="middle">context, prompt,</text>
    <text x="645" y="116" font-size="12" text-anchor="middle">audio of a piece</text>
    <line x1="700" y1="172" x2="592" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="645" y="190" font-size="12" text-anchor="middle">text of the piece</text>

    <!-- The app inserts the text -->
    <line x1="150" y1="224" x2="150" y2="302" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="160" y="268" font-size="12">inserts the text</text>

    <!-- Adapters -->
    <line x1="370" y1="354" x2="262" y2="354" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <text x="315" y="346" font-size="12" text-anchor="middle">read the chat</text>
    <line x1="480" y1="304" x2="480" y2="226" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="490" y="268" font-size="12">latest messages, terms</text>

    <!-- Config -->
    <line x1="700" y1="330" x2="592" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
    <text x="664" y="256" font-size="12" fill="#4b5563" text-anchor="middle">settings</text>
  </g>
</svg>
