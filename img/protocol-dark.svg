<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>A recording on one connection</title>
  <rect width="100%" height="100%" fill="#0d1117"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#e6edf3">
    <!-- Participants -->
    <rect x="80" y="20" width="200" height="44" rx="6" fill="#0f2238" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="180" y="47" font-size="15" font-weight="600" text-anchor="middle">Client (the app)</text>
    <rect x="480" y="20" width="200" height="44" rx="6" fill="#11281d" stroke="#3fb950" stroke-width="1.5"/>
    <text x="580" y="47" font-size="15" font-weight="600" text-anchor="middle">Dictation server</text>
    <line x1="180" y1="64" x2="180" y2="440" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="580" y1="64" x2="580" y2="440" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- Client to server: solid; server to client: solid back -->
    <line x1="180" y1="100" x2="578" y2="100" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="380" y="92" font-size="13" text-anchor="middle">start: model, language, snapshot</text>

    <line x1="180" y1="140" x2="578" y2="140" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="380" y="132" font-size="13" text-anchor="middle">audio, in binary messages, while you speak</text>

    <line x1="580" y1="180" x2="182" y2="180" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="380" y="172" font-size="13" text-anchor="middle">speech, while the server hears speech</text>

    <line x1="580" y1="220" x2="182" y2="220" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="380" y="212" font-size="13" text-anchor="middle">text of piece 1, cut while you speak</text>

    <line x1="180" y1="270" x2="578" y2="270" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="380" y="262" font-size="13" text-anchor="middle" fill="#f85149">stop</text>

    <line x1="580" y1="320" x2="182" y2="320" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="380" y="312" font-size="13" text-anchor="middle">text of each next piece, in order</text>

    <line x1="580" y1="370" x2="182" y2="370" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="380" y="362" font-size="13" text-anchor="middle">done</text>

    <text x="590" y="410" font-size="13" fill="#9da7b3">the server closes</text>
    <text x="590" y="428" font-size="13" fill="#9da7b3">the connection</text>
    <text x="24" y="460" font-size="12" fill="#8b949e">Time goes down. The order is real, the distances are not to scale.</text>
  </g>
</svg>
