<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
  <title>One dictation of 35 seconds</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Scale: 0 s at x=160, 18 px per second; 40 s at x=880 -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#111827">
    <!-- Row labels -->
    <text x="24" y="66" font-size="13">You speak</text>
    <text x="24" y="122" font-size="13">Pieces of audio</text>
    <text x="24" y="178" font-size="13">Model works</text>

    <!-- Speech: 0 to 35 s -->
    <rect x="160" y="48" width="630" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="475" y="66" font-size="13" text-anchor="middle">speech, 35 s</text>

    <!-- Pieces: 0 to 15 s and 15 to 35 s -->
    <rect x="160" y="104" width="270" height="26" rx="4" fill="#ecfdf5" stroke="#059669"/>
    <text x="295" y="122" font-size="12" text-anchor="middle">piece 1, cut while you speak</text>
    <rect x="430" y="104" width="360" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-dasharray="5 3"/>
    <text x="610" y="122" font-size="12" text-anchor="middle">piece 2, the rest, cut at the stop</text>

    <!-- Model: piece 1 after 20 s are heard, piece 2 after the stop; the bars show the order, not measured times -->
    <rect x="520" y="160" width="43" height="26" rx="4" fill="#ffedd5" stroke="#d97706"/>
    <rect x="790" y="160" width="41" height="26" rx="4" fill="#ffedd5" stroke="#d97706"/>

    <!-- The cut of piece 1 happens when 20 s are heard -->
    <line x1="520" y1="134" x2="520" y2="158" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="526" y="150" font-size="12" fill="#047857">20 s heard: piece 1 goes to the model</text>

    <!-- Stop and the text -->
    <line x1="790" y1="40" x2="790" y2="238" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="786" y="36" font-size="12" fill="#b91c1c" text-anchor="end">you stop</text>
    <line x1="831" y1="188" x2="831" y2="238" stroke="#374151" stroke-width="1.5"/>
    <text x="838" y="232" font-size="12">text inserted</text>

    <!-- Time axis -->
    <line x1="160" y1="252" x2="896" y2="252" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g font-size="12" text-anchor="middle" fill="#374151">
      <line x1="160" y1="252" x2="160" y2="258" stroke="#374151"/><text x="160" y="274">0</text>
      <line x1="250" y1="252" x2="250" y2="258" stroke="#374151"/><text x="250" y="274">5</text>
      <line x1="340" y1="252" x2="340" y2="258" stroke="#374151"/><text x="340" y="274">10</text>
      <line x1="430" y1="252" x2="430" y2="258" stroke="#374151"/><text x="430" y="274">15</text>
      <line x1="520" y1="252" x2="520" y2="258" stroke="#374151"/><text x="520" y="274">20</text>
      <line x1="610" y1="252" x2="610" y2="258" stroke="#374151"/><text x="610" y="274">25</text>
      <line x1="700" y1="252" x2="700" y2="258" stroke="#374151"/><text x="700" y="274">30</text>
      <line x1="790" y1="252" x2="790" y2="258" stroke="#374151"/><text x="790" y="274">35</text>
      <line x1="880" y1="252" x2="880" y2="258" stroke="#374151"/><text x="880" y="274">40</text>
    </g>
    <text x="520" y="302" font-size="13" text-anchor="middle" fill="#374151">time from the start of the recording, seconds; later to the right</text>
  </g>
</svg>
