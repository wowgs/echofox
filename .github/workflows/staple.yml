# The second half of a release (docs/distribution.md, "Releases"): release.yml's NOTARY_WEBHOOK starts it when
# Apple has checked a dmg that release.yml sent; the button (Actions, Run workflow)
# starts it too, with the submission's id from release.yml's log or notarytool history. It takes the signed dmg of the
# submission (the artifact EchoFox-notarizing-<id>), asks Apple for the verdict, and on Accepted staples Apple's
# ticket to the dmg and publishes it: a GitHub Release for a tag v*, else the artifact EchoFox-dmg. For a tag it also
# writes the update feed, appcast.xml (macos/make-appcast.sh, docs/distribution.md "Updates"), which the release
# carries beside the dmg. It needs no Developer ID key, only the notary key and the updates' EdDSA key. Three jobs: the artifact is looked up on Linux first, so that a call with an
# id that has no artifact costs no macOS start; only macOS staples; only the last job, on Linux, may write a release.
#
# Secrets: NOTARY_KEY_P8 (the App Store Connect API key, the .p8 file in base64), NOTARY_KEY_ID, NOTARY_ISSUER_ID;
# SPARKLE_ED_KEY (the private EdDSA key of the updates, as Sparkle's generate_keys -x writes it)
name: Staple
on:
  workflow_dispatch:
    inputs:
      submission:
        description: The notary submission's id
        required: true
permissions: {}
concurrency:
  group: staple-${{ inputs.submission }}
jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - name: The run that sent the submission and kept its signed dmg
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION: ${{ inputs.submission }}
        run: |
          [[ $SUBMISSION =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "not a submission id: $SUBMISSION"; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=EchoFox-notarizing-$SUBMISSION" \
            --jq '.artifacts[0].workflow_run.id // empty')
          [ -n "$run" ] || { echo "no artifact EchoFox-notarizing-$SUBMISSION"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
  staple:
    needs: find
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
    outputs:
      refType: ${{ steps.where.outputs.refType }}
      ref: ${{ steps.where.outputs.ref }}
    env:
      SUBMISSION: ${{ inputs.submission }}
    steps:
      - name: The signed dmg of the submission
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.find.outputs.run }}
        run: |
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "EchoFox-notarizing-$SUBMISSION" -D notarizing
          jq . notarizing/release.json
      - name: Apple's verdict
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          auth=(--key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID")
          status=$(xcrun notarytool info "$SUBMISSION" "${auth[@]}" --output-format json | jq -r .status)
          echo "Apple: $status"
          if [ "$status" = Invalid ]; then xcrun notarytool log "$SUBMISSION" "${auth[@]}"; fi
          [ "$status" = Accepted ] || { echo "not accepted (yet): nothing is published"; exit 1; }
      - name: The ticket stapled to the dmg, and Gatekeeper's verdict
        run: |
          xcrun stapler staple notarizing/EchoFox.dmg
          xcrun stapler validate notarizing/EchoFox.dmg
          spctl --assess --type open --context context:primary-signature -vv notarizing/EchoFox.dmg
      - name: Where the dmg goes
        id: where
        run: |
          {
            echo "refType=$(jq -r .refType notarizing/release.json)"
            echo "ref=$(jq -r .ref notarizing/release.json)"
            echo "sha=$(jq -r .sha notarizing/release.json)"
          } >> "$GITHUB_OUTPUT"
      - name: The scripts of the release's commit
        if: steps.where.outputs.refType == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.where.outputs.sha }}
          path: source
          persist-credentials: false
      - name: The update feed, signed, for the release's dmg
        if: steps.where.outputs.refType == 'tag'
        env:
          ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          TAG: ${{ steps.where.outputs.ref }}
        run: |
          [ -n "$ED_KEY" ] || { echo "no secret SPARKLE_ED_KEY: no update feed"; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/sparkle.key"' EXIT
          (umask 077 && printf '%s' "$ED_KEY" > "$RUNNER_TEMP/sparkle.key")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/EchoFox.dmg"
          source/macos/make-appcast.sh notarizing/EchoFox.dmg "$url" "$RUNNER_TEMP/sparkle.key" > notarizing/appcast.xml
          cat notarizing/appcast.xml
      - name: The stapled dmg and its feed (EchoFox-dmg; for a tag, the next job publishes them)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: EchoFox-dmg
          path: |
            notarizing/EchoFox.dmg
            notarizing/appcast.xml
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: staple
    if: needs.staple.outputs.refType == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: EchoFox-dmg
      - name: Published as the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.staple.outputs.ref }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$TAG is out already"; exit 0; fi
          gh release create "$TAG" EchoFox.dmg appcast.xml -R "$GITHUB_REPOSITORY" --title "EchoFox $TAG" --generate-notes
