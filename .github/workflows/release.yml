# The bundled app (macos/build-app.sh --dmg) as EchoFox.dmg (docs/distribution.md), after the tests
# (tests.yml). With the Developer ID secrets, the app is signed with Developer ID and the hardened runtime, and the dmg
# goes to Apple's notary service without waiting for it: the run keeps the signed dmg as the artifact
# EchoFox-notarizing-<submission id>, and when Apple has checked it, the notary relay (ci/notary-relay) starts
# staple.yml, which staples Apple's ticket and publishes the dmg (a GitHub Release for a tag v*, else an artifact).
# Without the secrets the run stops: the build signs only with Developer ID. The version is the tag's (build-app.sh), so the checkout
# takes the whole history. This workflow publishes nothing itself, so its token only reads; the checkout does not keep
# it either.
#
# Secrets:
#   DEVELOPER_ID_P12           the Developer ID Application certificate with its key, as a .p12 file in base64
#   DEVELOPER_ID_P12_PASSWORD  its password
#   DEVELOPER_ID_NAME          its name, for example "Developer ID Application: Alex Minaev (TEAMID)"
#   NOTARY_KEY_P8              an App Store Connect API key for notarytool, the .p8 file in base64
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  release:
    needs: tests
    runs-on: macos-26
    env:
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      # Apple calls it when the check is over; it starts staple.yml
      NOTARY_WEBHOOK: https://notary-webhook.invalid
    steps:
      - name: The Developer ID secrets are there
        if: env.HAS_DEVELOPER_ID != 'true'
        run: echo "the build needs the Developer ID secrets"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The cache of the pinned Python, llama-server and dmgbuild
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: macos/.cache
          # everything that decides what the cache holds; a cache is never saved again under the same key
          key: bundle-${{ hashFiles('macos/pins.sh', 'macos/build-app.sh', 'macos/dmg/requirements.txt') }}
      - name: The Developer ID certificate, in a keychain of this run
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/developer-id.p12"' EXIT
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Apple's intermediate certificate, which codesign needs to build the chain to Apple Root CA
          security import macos/app/DeveloperIDG2CA.cer -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046  # the list of keychains, split into its paths on purpose
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: The bundled app and its dmg
        env:
          DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID_NAME }}
        run: |
          # build-app.sh stops if the named identity is missing
          ECHOFOX_SIGN=$DEVELOPER_ID_NAME macos/build-app.sh --dmg
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" macos/build/EchoFox.app/Contents/Info.plist)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the app says version $version, the tag is $GITHUB_REF_NAME"; exit 1
          fi
      - name: The server's tests with the Python and the packages that ship in the app
        env:
          PYTHONDONTWRITEBYTECODE: 1  # nothing new in the signed bundle
        run: macos/build/EchoFox.app/Contents/Resources/python/bin/python3 -m unittest discover -s server
      - name: The dmg to Apple's notary service, without waiting
        id: notary
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          id=$(xcrun notarytool submit macos/build/EchoFox.dmg --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --webhook "$NOTARY_WEBHOOK" --no-wait --output-format json | jq -r .id)
          [[ $id =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "notarytool gave no submission id"; exit 1; }
          echo "submission $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          mkdir -p notarizing
          mv macos/build/EchoFox.dmg notarizing/
          jq -n --arg submission "$id" --arg ref "$GITHUB_REF_NAME" --arg refType "$GITHUB_REF_TYPE" \
            --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '$ARGS.named' > notarizing/release.json
      - name: The signed dmg, until Apple has checked it (staple.yml takes it)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: EchoFox-notarizing-${{ steps.notary.outputs.id }}
          path: notarizing/
          retention-days: 30
